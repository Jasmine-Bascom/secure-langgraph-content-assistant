[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "secure-langgraph-content-assistant"
version = "0.1.0"
description = "A security-focused LangGraph content assistant used for agent-security testing."
requires-python = ">=3.11"

dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "python-dotenv",
    "openai",
    "presidio-analyzer==2.2.363",
    "presidio-anonymizer==2.2.363",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "tavily-python",
]


[tool.setuptools]
packages = ["src"]